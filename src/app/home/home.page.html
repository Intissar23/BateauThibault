<ion-header>
  <ion-toolbar>

    <!-- BOUTON PANIER À GAUCHE -->
    <ion-buttons slot="start">
      <ion-button routerLink="/cart" fill="clear">
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- TITRE CENTRAL -->
    <ion-title>Bateau Thibault</ion-title>

    <!-- LOGO À DROITE -->
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <img src="assets/img/captain.png" class="header-avatar" />
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>


<ion-content class="home-content">

  <div class="home-wrapper">

    <!-- SECTION TITRE / INTRO -->
    <section class="hero">
      <h1>Bienvenue</h1>
      <p>
        Gérez le gérant, les bateaux, les restaurants et les produits de la mer.
      </p>
    </section>

    <!-- SECTION RACCOURCIS -->
    <section class="shortcuts">
      <div class="card-grid">

        <!-- Gérant -->
        <button class="shortcut-card" routerLink="/vue1">
          <div class="shortcut-icon">
            <img src="assets/img/gerant.png" alt="Gérant" />
          </div>
          <span>Gérant</span>
        </button>

        <!-- Bateaux -->
        <button class="shortcut-card" routerLink="/vue2">
          <div class="shortcut-icon">
            <img src="assets/img/boat.png" alt="Bateaux" />
          </div>
          <span>Bateaux</span>
        </button>

        <!-- Restaurants -->
        <button class="shortcut-card" routerLink="/vue3">
          <div class="shortcut-icon">
            <img src="assets/img/restaurant.png" alt="Restaurants" />
          </div>
          <span>Restaurants</span>
        </button>

        <!-- Recettes -->
        <button class="shortcut-card" routerLink="/vue4">
          <div class="shortcut-icon">
            <img src="assets/img/recipe.png" alt="Recettes" />
          </div>
          <span>Recettes</span>
        </button>

        <!-- Back-office -->
        <button class="shortcut-card" routerLink="/backoffice/login">
          <div class="shortcut-icon">
            <img src="assets/img/gerant.png" alt="Back-office" />
          </div>
          <span>Back-office</span>
        </button>

      </div>
    </section>

    <!-- SECTION CTA PRODUITS -->
    <section class="cta" routerLink="/vue5">
      <div class="cta-card">
        <div class="cta-text">
          <h2>Commander des produits</h2>
          <p>
            Accéder aux poissons, coquillages, crustacés et promotions.
          </p>
        </div>
        <button class="cta-button">Ouvrir</button>
      </div>
    </section>

     <!-- SECTION POINTS RELAIS (BAS DE PAGE) -->
    <section class="highlight">
      <div class="highlight-card">
        <div class="highlight-info">
          <h3>Points relais de livraison</h3>

          <ion-list class="relay-list">
            <ion-item *ngFor="let relay of relayPoints" lines="none">
              <ion-label>
                <h4>{{ relay.name }}</h4>
                <p>{{ relay.address }}</p>
                <p *ngIf="relay.hours">Horaires : {{ relay.hours }}</p>
              </ion-label>
            </ion-item>
          </ion-list>
        </div>
      </div>
    </section>

  </div>

</ion-content>
